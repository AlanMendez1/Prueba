; CalculadoraIA — prototipo MÍNIMO (fase 0: ESP32-S3-DevKitC + TFT SPI + 24 pulsadores)
;
; Compilar y subir:   pio run -e ili9341 -t upload      (o -e st7789 según tu pantalla;
;                     -e pcb en la PCB mínima de la fase 1)
; Monitor serie:      pio device monitor
; Pruebas en la PC:   pio test -e native

[platformio]
default_envs = ili9341

[esp32]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
    bodmer/TFT_eSPI@2.5.43
    bblanchon/ArduinoJson@7.2.1
build_flags =
    ; Serial por el USB nativo (el mismo que tendrá la PCB final)
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; --- TFT_eSPI configurado aquí (no hace falta editar User_Setup.h) ---
    -DUSER_SETUP_LOADED=1
    -DDISABLE_ALL_LIBRARY_WARNINGS=1
    -DUSE_HSPI_PORT=1
    -DTFT_MISO=-1
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_CS=10
    -DTFT_DC=13
    -DTFT_RST=14
    -DTFT_BL=21
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DSPI_FREQUENCY=40000000

; Módulo ILI9341 240x320 (2.8"/3.2" SPI típicos)
[env:ili9341]
extends = esp32
build_flags =
    ${esp32.build_flags}
    -DILI9341_DRIVER=1
    -DTFT_BACKLIGHT_ON=HIGH

; Módulo ST7789 240x320. Si los colores salen invertidos, agrega -DTFT_INVERSION_OFF
; (o -DTFT_INVERSION_ON); si rojo y azul están cambiados, -DTFT_RGB_ORDER=TFT_BGR.
[env:st7789]
extends = esp32
build_flags =
    ${esp32.build_flags}
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_BACKLIGHT_ON=HIGH

; Pruebas de la lógica (calculadora y texto) en la PC, sin hardware
[env:native]
platform = native
test_build_src = yes
build_src_filter = -<*> +<calculator.cpp> +<text_utils.cpp>

; PCB mínima (fase 1): la retroiluminación pasa por un P-MOSFET (Q2) → se enciende con LOW
[env:pcb]
extends = esp32
build_flags =
    ${esp32.build_flags}
    -DILI9341_DRIVER=1
    -DTFT_BACKLIGHT_ON=LOW
