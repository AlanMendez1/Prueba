; CalculadoraIA — prototipo MÍNIMO (fase 0: ESP32-S3-DevKitC + TFT SPI + 24 pulsadores)
;
; Compilar y subir:   pio run -e st7789 -t upload       (o -e ili9341 según tu pantalla;
;                     -e pcb en la PCB mínima de la fase 1)
; Monitor serie:      pio device monitor
; Pruebas en la PC:   pio test -e native

[platformio]
default_envs = st7789

[esp32]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
; Módulo ESP32-S3 N16R8: 16 MB de flash en modo DIO (más tolerante que QIO en placas clónicas)
; y PSRAM octal. Con la configuración por defecto (qio_qspi) la placa se reiniciaba en bucle.
board_build.arduino.memory_type = dio_opi
board_build.flash_mode = dio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
framework = arduino
monitor_speed = 115200
; Grabar a 115200: más lento pero más confiable en placas clónicas
upload_speed = 115200
lib_deps =
    bodmer/TFT_eSPI@2.5.43
    bblanchon/ArduinoJson@7.2.1
build_flags =
    ; --- TFT_eSPI configurado aquí (no hace falta editar User_Setup.h) ---
    -DUSER_SETUP_LOADED=1
    -DDISABLE_ALL_LIBRARY_WARNINGS=1
    -DUSE_HSPI_PORT=1
    -DTFT_MISO=-1
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_CS=10
    -DTFT_DC=13
    -DTFT_RST=14
    -DTFT_BL=21
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1

; Protoboard con DevKitC (fase 0)
[devkit]
build_flags =
    ; Serial por la entrada COM del DevKitC (la que se usa para subir el programa)
    -DARDUINO_USB_CDC_ON_BOOT=0
    ; SPI más lento: los cables dupont largos no aguantan 40 MHz
    -DSPI_FREQUENCY=20000000

; Módulo ILI9341 240x320 (2.8"/3.2" SPI típicos)
[env:ili9341]
extends = esp32
build_flags =
    ${esp32.build_flags}
    ${devkit.build_flags}
    -DILI9341_DRIVER=1
    -DTFT_BACKLIGHT_ON=HIGH

; Módulo ST7789 240x320 (el rojo de 2,8" con panel TPM408-2.8). Sin inversión de color y con
; orden BGR: con los valores por defecto el fondo sale blanco y rojo/azul cambiados.
[st7789]
build_flags =
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_INVERSION_OFF=1
    -DTFT_RGB_ORDER=TFT_BGR

[env:st7789]
extends = esp32
build_flags =
    ${esp32.build_flags}
    ${st7789.build_flags}
    -DTFT_BACKLIGHT_ON=HIGH
    ${devkit.build_flags}

; Pruebas de la lógica (calculadora y texto) en la PC, sin hardware
[env:native]
platform = native
test_build_src = yes
build_src_filter = -<*> +<calculator.cpp> +<text_utils.cpp>

; PCB mínima (fase 1): la retroiluminación pasa por un P-MOSFET (Q2) → se enciende con LOW
[env:pcb]
extends = esp32
build_flags =
    ${esp32.build_flags}
    ${st7789.build_flags}
    -DTFT_BACKLIGHT_ON=LOW
    ; Serial por el USB nativo (la PCB solo tiene ese USB)
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DSPI_FREQUENCY=40000000
